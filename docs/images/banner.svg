<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="#0D1117"/>
  <!-- Database cylinder -->
  <g transform="translate(45, 45)">
    <!-- Cylinder body -->
    <path d="M 12 30 L 12 108 A 54 15 0 0 0 120 108 L 120 30" fill="url(#g1)" opacity="0.85"/>
    <path d="M 12 30 L 12 108 A 54 15 0 0 0 120 108 L 120 30" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
    <!-- Top disk -->
    <ellipse cx="66" cy="30" rx="54" ry="15" fill="#1C2128" stroke="#fff" stroke-width="1.5"/>
    <ellipse cx="66" cy="30" rx="54" ry="15" fill="url(#g1)" opacity="0.35"/>
    <!-- Middle disk lines -->
    <path d="M 12 55 A 54 15 0 0 0 120 55" stroke="#fff" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M 12 81 A 54 15 0 0 0 120 81" stroke="#fff" stroke-width="1" opacity="0.4" fill="none"/>
    <!-- Graph nodes stored inside the DB -->
    <g stroke="url(#g2)" stroke-width="1.2" opacity="0.95">
      <line x1="48" y1="62" x2="84" y2="62"/>
      <line x1="48" y1="62" x2="66" y2="92"/>
      <line x1="84" y1="62" x2="66" y2="92"/>
      <line x1="30" y1="92" x2="48" y2="62"/>
      <line x1="102" y1="92" x2="84" y2="62"/>
    </g>
    <g fill="url(#g2)">
      <circle cx="48" cy="62" r="4"/>
      <circle cx="84" cy="62" r="4"/>
      <circle cx="66" cy="92" r="4.5"/>
      <circle cx="30" cy="92" r="3"/>
      <circle cx="102" cy="92" r="3"/>
    </g>
    <!-- Asset nodes feeding into the DB from above -->
    <g>
      <circle cx="30" cy="0" r="3.5" fill="#22D3EE"/>
      <circle cx="66" cy="-8" r="3.5" fill="#3B82F6"/>
      <circle cx="102" cy="0" r="3.5" fill="#8B5CF6"/>
      <line x1="31" y1="1" x2="47" y2="57" stroke="#22D3EE" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
      <line x1="66" y1="-6" x2="66" y2="16" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
      <line x1="101" y1="1" x2="85" y2="57" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    </g>
  </g>
  <!-- Title -->
  <text x="205" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#fff">
    Unity<tspan fill="url(#g2)">AssetDB</tspan>
  </text>
  <text x="207" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#8B949E">
    🗄️ Every asset reference in your Unity project, in one queryable database
  </text>
  <!-- Query chain -->
  <g opacity="0.4" stroke="url(#g2)" stroke-width="1.5" fill="none">
    <circle cx="207" cy="150" r="3" fill="#22D3EE"/>
    <circle cx="267" cy="150" r="3" fill="#3B82F6"/>
    <circle cx="327" cy="150" r="3" fill="#8B5CF6"/>
    <circle cx="387" cy="150" r="3" fill="#FF2D55"/>
    <line x1="210" y1="150" x2="264" y2="150"/>
    <line x1="270" y1="150" x2="324" y2="150"/>
    <line x1="330" y1="150" x2="384" y2="150"/>
  </g>
  <text x="207" y="175" font-family="monospace" font-size="11" fill="#58A6FF">Scene → Material → Shader → Texture</text>
</svg>
