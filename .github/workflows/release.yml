name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive != 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../unityassetdb-${{ matrix.target }}.tar.gz unityassetdb

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../unityassetdb-${{ matrix.target }}.zip unityassetdb.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unityassetdb-${{ matrix.target }}
          path: |
            unityassetdb-${{ matrix.target }}.tar.gz
            unityassetdb-${{ matrix.target }}.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unityassetdb-${{ matrix.target }}.tar.gz
            unityassetdb-${{ matrix.target }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
